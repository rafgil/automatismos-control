<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat Gemini</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<button onclick="setKey()" class="bg-blue-600 text-white px-4 py-2 rounded">
Configurar API
</button>

<div id="chat" class="mt-4 bg-white p-4 rounded shadow max-w-xl">
<div id="box" class="h-80 overflow-y-auto mb-4 space-y-2"></div>

<input id="input" class="border p-2 w-full" placeholder="Pregunta...">
<button onclick="send()" class="bg-green-600 text-white px-4 py-2 mt-2 rounded">
Enviar
</button>
</div>

<script>
let apiKey = localStorage.getItem("gemini_key") || "";

function setKey(){
    const k = prompt("API Key:", apiKey);
    if(k){
        apiKey = k.trim();
        localStorage.setItem("gemini_key", apiKey);
    }
}

async function ask(text){

    try{
        const res = await fetch(
        `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`,
        {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({
                contents:[
                    {
                        role:"user",
                        parts:[{ text:text }]
                    }
                ]
            })
        });

        const data = await res.json();

        if(!res.ok){
            console.error(data);
            return "❌ " + (data.error?.message || "Error");
        }

        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sin respuesta";

    }catch(e){
        return "❌ Error de conexión";
    }
}

async function send(){
    const input = document.getElementById("input");
    const text = input.value.trim();
    if(!text) return;

    add("user", text);
    input.value = "";

    const r = await ask(text);
    add("ai", r);
}

function add(role, text){
    const div = document.createElement("div");
    div.className = role === "user" ? "text-right" : "text-left";
    div.innerHTML = `<span class="inline-block p-2 rounded ${role==="user"?"bg-blue-500 text-white":"bg-gray-200"}">${text}</span>`;
    document.getElementById("box").appendChild(div);
}
</script>

</body>
</html>
