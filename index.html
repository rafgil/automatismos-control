<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat Gemini AI Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-xl mx-auto bg-white p-4 rounded shadow">
    
    <button onclick="setKey()" class="bg-blue-600 text-white px-4 py-2 rounded mb-3">
        Configurar API
    </button>

    <div id="chat" class="h-80 overflow-y-auto border p-3 mb-3 space-y-2"></div>

    <div class="flex gap-2">
        <input id="input" class="flex-1 border p-2 rounded" placeholder="Escribe tu pregunta...">
        <button onclick="send()" class="bg-green-600 text-white px-4 rounded">
            Enviar
        </button>
    </div>
</div>

<script>

let apiKey = localStorage.getItem("gemini_key") || "";

function setKey(){
    const k = prompt("Introduce tu API Key:", apiKey);
    if(k !== null){
        apiKey = k.trim();
        localStorage.setItem("gemini_key", apiKey);
    }
}

function add(role, text){
    const div = document.createElement("div");
    div.className = role === "user" ? "text-right" : "text-left";

    div.innerHTML = `
        <span class="inline-block px-3 py-2 rounded 
        ${role==="user" ? "bg-blue-500 text-white" : "bg-gray-200"}">
        ${text}
        </span>
    `;

    const chat = document.getElementById("chat");
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function callGemini(text){

    if(!apiKey){
        return "⚠️ Introduce la API Key";
    }

    try{

        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                { text: text }
                            ]
                        }
                    ]
                })
            }
        );

        const data = await res.json();

        if(!res.ok){
            console.error(data);
            return `❌ ${data.error?.message}`;
        }

        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sin respuesta";

    }catch(e){
        console.error(e);
        return "❌ Error de conexión";
    }
}

async function send(){
    const input = document.getElementById("input");
    const text = input.value.trim();
    if(!text) return;

    add("user", text);
    input.value = "";

    const reply = await callGemini(text);
    add("ai", reply);
}

document.getElementById("input")
.addEventListener("keypress", e => {
    if(e.key === "Enter") send();
});

</script>

</body>
</html>
