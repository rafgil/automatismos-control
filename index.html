<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor IA Tecnología</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

<style>
body { font-family: sans-serif; }
.ai-message { background: #f1f5f9; padding: 10px; border-radius: 10px; }
.user-message { background: #2563eb; color: white; padding: 10px; border-radius: 10px; align-self: flex-end; }
</style>
</head>

<body class="bg-slate-100">

<div class="p-4">
<button onclick="promptForKey()" class="bg-blue-600 text-white px-4 py-2 rounded">Configurar API</button>
<button onclick="toggleChat()" class="bg-green-600 text-white px-4 py-2 rounded">Abrir chat</button>
</div>

<div id="chat" class="hidden p-4 max-w-xl mx-auto bg-white rounded shadow flex flex-col h-[500px]">
<div id="chat-box" class="flex-1 overflow-y-auto space-y-2"></div>

<div class="flex mt-2">
<input id="user-input" class="flex-1 border p-2" placeholder="Pregunta...">
<button onclick="sendMsg()" class="bg-blue-600 text-white px-4">Enviar</button>
</div>
</div>

<script>
let apiKey = localStorage.getItem('gemini_key') || "";

const SYSTEM_PROMPT = "Eres un profesor de Tecnología. Explica de forma clara y didáctica.";

function promptForKey() {
    const val = prompt("Introduce tu API Key:", apiKey);
    if (val !== null) {
        apiKey = val.trim();
        localStorage.setItem('gemini_key', apiKey);
    }
}

function toggleChat() {
    document.getElementById('chat').classList.toggle('hidden');
}

async function callIA(userText) {

    if (!apiKey) {
        addMsg('ai', "⚠️ Introduce la API Key.");
        return;
    }

    try {
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [
                        {
                            role: "user",
                            parts: [{ text: userText }]
                        }
                    ],
                    systemInstruction: {
                        parts: [{ text: SYSTEM_PROMPT }]
                    }
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            console.error(data);
            return `❌ Error ${response.status}: ${data.error?.message}`;
        }

        if (data.candidates && data.candidates.length > 0) {
            return data.candidates[0].content.parts[0].text;
        }

        return "⚠️ Respuesta vacía.";

    } catch (err) {
        console.error(err);
        return "❌ Error de conexión.";
    }
}

async function sendMsg() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    addMsg('user', text);
    input.value = "";

    const reply = await callIA(text);
    if (reply) addMsg('ai', reply);
}

function addMsg(role, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');

    div.className = role === 'user' ? 'user-message' : 'ai-message';
    div.innerHTML = role === 'ai' ? marked.parse(text) : text;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

document.getElementById('user-input')
.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMsg();
});
</script>

</body>
</html>
